x-ollama-image: &ollama-image ollama/ollama:${OLLAMA_TAG:?Set OLLAMA_TAG in .env} # macro that errors if env get fails, returns accurate image
x-ollama-healthcheck: &ollama-healthcheck # macro that writes entire ollama healthcheck config
  healthcheck:
    test: ["CMD", "ollama", "list"]
    interval: 15s
    timeout: 10s
    retries: 5
    start_period: 30s

services:
  ollama-a: # container for first ollama instance
    image: *ollama-image
    container_name: ollama-a
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    cpus: 1.5
    mem_limit: 4G
    memswap_limit: 4G
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 2
    <<: *ollama-healthcheck

  ollama-b: # container for second ollama instance
    image: *ollama-image
    container_name: ollama-b
    depends_on:
      ollama-a:
        condition: service_healthy # start after ollama-a to avoid key file overwrites
    restart: unless-stopped
    ports:
      - "11435:11434"
    volumes:
      - ollama-models:/root/.ollama
    cpus: 1.5
    mem_limit: 4G
    memswap_limit: 4G
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "-1"
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 2
    <<: *ollama-healthcheck

  ollama-init: # setup for instance
    image: *ollama-image
    container_name: ollama-init
    depends_on:
      ollama-a:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama-a:11434
    entrypoint: ["/bin/sh", "-c"]
    command: > # wait for ollama instance to be healthy, then pull the required models to the volume
      "until ollama list >/dev/null 2>&1; do sleep 2; done &&
      ollama pull llama3.2:1b &&
      ollama pull nomic-embed-text"
    cpus: 0.5
    mem_limit: 1G
    restart: "no"

volumes:
  ollama-models: